<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A股市场状态</title>
  <meta name="description" content="按设定条件实时判定 A 股处于主升、震荡还是主跌，并在状态切换时网页内提醒。">
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--fg:#1f2733;--muted:#6b7686;--line:#e2e6ec;--chip:#eef1f5;
      --up:#d63c3c;--up-bg:#fdeeee;--down:#1f8a4c;--down-bg:#e9f6ee;--emo:#b15ad1;--emo-bg:#f6ecfa;--flat:#5b6b80;--flat-bg:#eef1f5;
      --ok:#1f8a4c;--no:#a6b0bd;--unk:#c47f00;--warn-bg:#fff4dc;--err-bg:#fde8e8;--accent:#2458a6}
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151b;--card:#1a2029;--fg:#e4e9f0;--muted:#97a3b3;--line:#2b3340;--chip:#232b36;
      --up:#ff6b6b;--up-bg:#3a1f22;--down:#4cc684;--down-bg:#1a3326;--emo:#d38cf0;--emo-bg:#33223b;--flat:#9fb0c4;--flat-bg:#232b36;
      --ok:#4cc684;--no:#5d6878;--unk:#f0b43c;--warn-bg:#3a3018;--err-bg:#3d1f22;--accent:#7aa7ea}}
    :root[data-theme="dark"]{--bg:#11151b;--card:#1a2029;--fg:#e4e9f0;--muted:#97a3b3;--line:#2b3340;--chip:#232b36;
      --up:#ff6b6b;--up-bg:#3a1f22;--down:#4cc684;--down-bg:#1a3326;--emo:#d38cf0;--emo-bg:#33223b;--flat:#9fb0c4;--flat-bg:#232b36;
      --ok:#4cc684;--no:#5d6878;--unk:#f0b43c;--warn-bg:#3a3018;--err-bg:#3d1f22;--accent:#7aa7ea}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    header{max-width:1240px;margin:0 auto;padding:18px 16px 8px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{margin:0;font-size:22px;letter-spacing:.5px}
    .hdr-right{display:flex;gap:8px;align-items:center}
    #updated{color:var(--muted);font-size:12px}
    button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
    button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
    #status{max-width:1240px;margin:0 auto;padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:6px}
    .chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
    .chip.warn{background:var(--warn-bg);color:var(--unk)}.chip.err{background:var(--err-bg);color:var(--up)}
    main{max-width:1240px;margin:0 auto;padding:0 16px 24px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
    @media (max-width:860px){main{grid-template-columns:1fr}#summary{order:-1}}
    .panel{min-width:0}
    .panel>h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px;letter-spacing:1px}
    .cgroup,.card,.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
    .cgroup h3,.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .count{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
    .cgroup ul{list-style:none;margin:0;padding:0}
    .cgroup li{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
    .cgroup li:first-child{border-top:0}
    .ok,.no,.unk{display:inline-block;width:18px;text-align:center;font-weight:700;flex:none}
    .ok{color:var(--ok)}.no{color:var(--no)}.unk{color:var(--unk)}
    .c-label{flex:0 1 auto}.c-read{color:var(--muted);font-size:13px;flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
    .refline{color:var(--muted);font-size:12px;margin:-4px 2px 12px}
    .stage{border-width:2px}
    .stage.up{border-color:var(--up);background:var(--up-bg)}.stage.down{border-color:var(--down);background:var(--down-bg)}
    .stage.emo{border-color:var(--emo);background:var(--emo-bg)}.stage.flat{border-color:var(--flat);background:var(--flat-bg)}
    .stage-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .stage-name{font-size:30px;font-weight:800;letter-spacing:2px}
    .stage.up .stage-name{color:var(--up)}.stage.down .stage-name{color:var(--down)}.stage.emo .stage-name{color:var(--emo)}.stage.flat .stage-name{color:var(--flat)}
    .pos{font-size:15px;font-weight:700;border:1px solid currentColor;border-radius:8px;padding:2px 10px}
    .stage-sub{margin:2px 0 6px;color:var(--muted)}.action{margin:0;font-weight:600}
    .tentative{margin:8px 0 0;padding:6px 8px;border-radius:8px;background:var(--warn-bg);color:var(--fg);font-size:13px}
    .boards{list-style:none;margin:0;padding:0}
    .boards li{padding:8px 0;border-top:1px dashed var(--line)}.boards li:first-child{border-top:0}
    .boards strong{font-size:16px;margin-right:8px}.fam{color:var(--muted);font-size:12px}
    .nums{display:flex;gap:14px;color:var(--muted);font-size:13px;margin-top:2px}
    .etf{margin-top:4px;font-size:13px}.etf small{display:block;color:var(--muted)}
    .tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{text-align:left;padding:4px 6px;border-top:1px solid var(--line)}
    .tbl th{color:var(--muted);font-weight:500}.up-t{color:var(--up)}
    .card{overflow-x:auto}
    .note{color:var(--muted);font-size:12px;margin:6px 0 0}.muted{color:var(--muted);margin:0}
    .log{list-style:none;margin:0;padding:0;font-size:13px}.log li{padding:3px 0}.log time{color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}.log b{margin-right:6px}
    footer{max-width:1240px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:12px}
    #toast{position:fixed;right:16px;bottom:16px;max-width:min(380px,calc(100vw - 32px));background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:10}
    #toast p{margin:4px 0 8px}
  </style>
</head>
<body>
  <header>
    <h1>A股市场状态</h1>
    <div class="hdr-right"><span id="updated"></span><button id="alert-btn" type="button" aria-pressed="false">开启网页提醒</button></div>
  </header>
  <div id="status" aria-live="polite"></div>
  <main>
    <div class="panel"><h2>判定条件（括号内为实时读数）</h2><div id="conditions"></div></div>
    <div class="panel" id="summary"></div>
  </main>
  <footer>
    <p>说明：本页面按预先设定的规则，对公开行情数据做自动判定。盘中结论为试算，10:30 后状态切换发出预警，14:40 后仍成立发出确认，收盘后定格。数据缺失时显示「?」，不会因此判为震荡或发出提醒。个股只列客观数据，仓位只显示规则档位，不构成投资建议，不提供下单。</p>
    <p>数据：上证指数、深证成指、中证全指、同花顺行业与概念板块、涨跌停统计等公开行情；成交额口径为上证指数 + 深证成指成交额。</p>
  </footer>
  <div id="toast" role="alert" hidden></div>
  <noscript>需要启用 JavaScript。</noscript>
  <script type="module" src="./js/app.js?v=20261015c"></script>
</body>
</html>
